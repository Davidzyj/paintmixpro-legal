<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>塗装配合計算 - サポート</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #111318;
      --muted: #68707c;
      --accent: #16834b;
      --line: #e4e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
    }

    p {
      margin: 0 0 18px;
    }

    .muted {
      color: var(--muted);
    }

    nav {
      display: grid;
      gap: 12px;
      margin-top: 24px;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    .link {
      display: block;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      background: #fbfcfd;
    }

    .link span {
      display: block;
      color: var(--muted);
      font-weight: 400;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <h1>塗装配合計算</h1>
      <p class="muted">PaintMixPro support and legal information.</p>
      <nav aria-label="Legal and support pages">
        <a class="link" href="./privacy-policy.html">
          プライバシーポリシー
          <span>Privacy Policy</span>
        </a>
        <a class="link" href="./support.html">
          サポート
          <span>Technical Support</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
